<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="失われた六時間の記憶を取り戻すため、あの夜の実験を再構築する。原料を採り、加工し、パイプでつなぎ、実験台へ送る放置型の工場ゲーム。">
<meta property="og:type" content="website">
<meta property="og:title" content="空白の六時間">
<meta property="og:description" content="失われた六時間の記憶を取り戻すため、あの夜の実験を再構築する。原料を採り、加工し、パイプでつなぎ、実験台へ送る放置型の工場ゲーム。">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#DDE5E8">
<title>空白の六時間</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 構成: 観測球のヒーロー(光は章の進行で強まる) → 固定ステータス帯 → タブ → 工場盤(自由配置+パイプ)と選択パネル */
:root{
  --bg:#DDE5E8; --panel:#EEF2F4; --panel2:#E1E8EB; --ink:#13232D; --mute:#556975; --line:#B7C5CC;
  --sea:#2A6C8C; --moss:#3F7545; --lamp:#A9640A; --lampfill:#F0B13A; --lampink:#1B1203; --rust:#B3452F;
  --fogc:rgba(19,35,45,.14);
  --f-disp:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-story:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-ui:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1820; --panel:#13242E; --panel2:#1B303C; --ink:#DCE8EE; --mute:#8CA3AF; --line:#2A4452;
    --sea:#62B3D6; --moss:#84C48A; --lamp:#F2B33D; --lampfill:#F2B33D; --rust:#E2765D; --fogc:rgba(220,232,238,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1820; --panel:#13242E; --panel2:#1B303C; --ink:#DCE8EE; --mute:#8CA3AF; --line:#2A4452;
  --sea:#62B3D6; --moss:#84C48A; --lamp:#F2B33D; --lampfill:#F2B33D; --rust:#E2765D; --fogc:rgba(220,232,238,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-ui);padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.app{max-width:1180px;margin:0 auto}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.k{font-size:.72rem;letter-spacing:.14em;color:var(--mute);font-weight:700}
.story{font-family:var(--f-story);font-size:.98rem;line-height:1.9;font-weight:500;max-width:62ch}
.hint{color:var(--mute);font-size:.85rem}

/* ヒーロー */
.hero{position:relative;display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:8px 24px;align-items:end;padding-block:24px 14px;overflow:hidden;--lit:0}
.lh svg{display:block;width:100%;height:auto;max-height:230px}
.hero-txt{position:relative;z-index:1;display:grid;gap:8px;padding-bottom:10px;min-width:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(1.7rem,5.4vw,3rem);line-height:1.15;letter-spacing:.02em}
.hero-sub{min-height:1.7em;max-width:46ch;color:var(--mute);font-family:var(--f-story);font-size:.95rem;font-weight:500}
.ticks{display:flex;gap:4px;margin-top:2px}
.ticks i{flex:0 0 auto;width:clamp(10px,2.6vw,22px);height:8px;background:var(--line);border-radius:1px}
.ticks i.on{background:var(--lampfill)}
.fog{position:absolute;left:-30%;width:160%;height:64px;background:linear-gradient(90deg,transparent,var(--fogc),transparent);filter:blur(12px);opacity:calc(1 - var(--lit)*.85);animation:drift 30s linear infinite;pointer-events:none}
.fog.f1{bottom:34px}.fog.f2{bottom:6px;animation-duration:44s;animation-direction:reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.beam{opacity:calc(var(--lit)*.9);transform-origin:100px 66px;animation:sweep 7s ease-in-out infinite alternate}
.beam.l{animation-delay:-3.5s}
@keyframes sweep{from{transform:scaleX(1)}to{transform:scaleX(.5)}}
.wave{animation:bob 6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.beam,.wave,.fog{animation:none}}

/* ステータス帯 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-block:1px solid var(--line)}
.bar-in{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;padding-block:8px}
.stat{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.stat b{display:inline-block;min-width:4.6ch}
#sCoins{min-width:8ch}
#sInc{display:inline-block;min-width:8.5ch}
.bar-in{min-height:46px}
.stat b{font-family:var(--f-disp);font-weight:400;font-size:1.12rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-variant-numeric:tabular-nums}
.bar .btn{margin-left:auto}

/* タブ */
.tabs{display:flex;gap:2px;overflow-x:auto;padding-top:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.5rem .85rem;font-weight:700;color:var(--mute);white-space:nowrap;cursor:pointer;position:relative}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lampfill)}
.tab.dim{opacity:.45}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lampfill);margin-left:6px;vertical-align:middle}

.shell{padding-top:20px}
.pane{display:none;min-width:0}
.pane.on{display:block}

/* 共通部品 */
.btn{border:1px solid var(--ink);background:transparent;padding:.4rem .85rem;border-radius:3px;min-height:36px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--lampfill);border-color:var(--lampfill);color:var(--lampink);font-weight:700}
.btn.pri:hover:not(:disabled){background:var(--lampfill);color:var(--lampink);filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:.25rem .6rem;font-size:.9rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.danger{border-color:var(--rust);color:var(--rust)}
.btn.danger:hover:not(:disabled){background:var(--rust);color:#fff}
.t0{--tc:var(--sea)}.t1{--tc:var(--moss)}.t2{--tc:var(--lamp)}.tn{--tc:var(--ink)}
.stamp{flex:none;display:inline-grid;place-items:center;width:34px;height:34px;font-family:var(--f-disp);font-size:1.05rem;line-height:1;color:var(--tc);border:2px solid var(--tc);border-radius:4px;transform:rotate(-4deg)}
.stamp.mini{width:22px;height:22px;font-size:.72rem;border-width:1.5px;border-radius:3px}
.gauge{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--tc,var(--sea))}
.gauge.warn i{background:var(--rust)}
.pill{font-size:.72rem;font-weight:700;padding:.1rem .5rem;border-radius:10px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{color:var(--moss)}.pill.warn{color:var(--lamp)}.pill.bad{color:var(--rust)}
.pill:empty{display:none}
h2.sec{font-family:var(--f-disp);font-weight:400;font-size:1.25rem;margin:0 0 10px}
h3.grp{font-size:.78rem;letter-spacing:.16em;color:var(--mute);margin:22px 0 8px;font-weight:700}

/* 工場 */
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{border:1px solid var(--ink);background:transparent;border-radius:3px;min-height:36px;padding:.3rem .9rem;font-weight:700;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tool.del[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.tools-wrap{position:relative}
.helpbtn{margin-left:auto;position:relative;border:1px solid var(--line);background:var(--panel);border-radius:3px;min-height:36px;padding:.3rem .8rem;font-weight:700;cursor:pointer;color:var(--ink)}
.helpbtn span{font-size:.8rem;margin-left:4px}
.helpbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.helpbtn.new::after{content:"";position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--rust)}
@media (max-width:560px){ .helpbtn{flex:0 0 auto;padding:.3rem .6rem} .helpbtn span{display:none} }
.fac-hint{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:8;background:var(--panel);border:1px solid var(--ink);border-radius:3px;padding:10px 14px;font-size:.9rem;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.fac-hint b{color:var(--lamp)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,158px),1fr));gap:6px;margin-top:8px}
.pb{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 8px;cursor:pointer;min-height:42px;min-width:0}
.pb:hover:not(:disabled){border-color:var(--ink)}
.pb[aria-pressed="true"]{border-color:var(--lampfill);box-shadow:0 0 0 1px var(--lampfill) inset}
.pb:disabled{opacity:.42;cursor:not-allowed}
.pb .nm{font-size:.85rem;font-weight:700;line-height:1.25;display:block}
.pb .cs{font-size:.72rem;color:var(--mute);font-variant-numeric:tabular-nums;display:block}
.pb .tx{min-width:0}
.pal-note{display:none}
@media (max-width:560px){ .tool{flex:1 1 0;min-width:0;padding:.3rem .2rem} }
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cat{border:1px solid var(--line);background:var(--panel);border-radius:3px;min-height:34px;padding:.2rem .85rem;font-weight:700;cursor:pointer;font-size:.88rem}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat.dim{opacity:.5}
.cats .tool{flex:none;min-height:34px;padding:.2rem .85rem;font-size:.88rem;margin-left:auto}
.fac-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:12px}
@media (min-width:980px){.fac-grid{grid-template-columns:minmax(0,max-content) 310px;justify-content:start;align-items:start}}
.board{overflow:auto;border:1px solid var(--line);border-radius:3px;background:var(--panel2);max-height:min(68vh,660px);overscroll-behavior:contain}
#cv{display:block;cursor:crosshair}
.board{touch-action:pan-x pan-y}
.tool:disabled,.tab:disabled{opacity:.35;cursor:not-allowed}
.board-wrap{position:relative;min-width:0;width:fit-content;max-width:100%}
.zoom-ctl{position:absolute;right:16px;bottom:16px;display:grid;gap:4px;z-index:3}
.zoom-ctl button{min-width:40px;min-height:36px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:3px;font-weight:700;cursor:pointer;font-size:.9rem;padding:0 6px}
.zoom-ctl button:disabled{opacity:.4;cursor:default}
.insp{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:10px;align-content:start;min-width:0}
.insp:empty{display:none}
.i-head{display:flex;gap:10px;align-items:center}
.i-head .tt{flex:1;min-width:0;display:grid;line-height:1.3}
.i-row{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;font-variant-numeric:tabular-nums}
.i-row span:first-child{color:var(--mute)}
.i-list{display:grid;gap:6px}
.i-link{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:.85rem;border:1px solid var(--line);border-radius:3px;padding:4px 6px 4px 8px}
.i-link button.nm{background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0;flex:1;font-size:.85rem;color:var(--ink)}
.i-link button.nm:hover{text-decoration:underline}
.sel{border:1px solid var(--line);background:var(--panel2);border-radius:3px;min-height:34px;padding:.2rem .4rem;width:100%}
.stk{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.stk .chip{justify-content:flex-start}
.empty-note{color:var(--mute);font-size:.9rem}

/* 研究: テーマ札 */
.tag{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px 14px 44px;display:grid;gap:10px;min-width:0}
.tag::before{content:"";position:absolute;left:15px;top:17px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tag.main{border-color:var(--lampfill);box-shadow:0 0 0 1px var(--lampfill) inset}
.tag-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tag-h h3{font-size:1.1rem}
.ch-stamp{font-family:var(--f-disp);font-size:.8rem;color:var(--lamp);border:2px solid var(--lamp);border-radius:3px;padding:.05rem .45rem;transform:rotate(-3deg)}
.who{color:var(--mute);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:3px;padding:3px 8px 3px 4px;font-size:.85rem;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip.ok{border-color:var(--moss);color:var(--moss)}
.chip.over{border-color:var(--rust);color:var(--rust)}
.tag-f{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.reward{font-weight:700;font-variant-numeric:tabular-nums}
.side-list{display:grid;gap:12px;margin-top:6px}
.empty-tag{border:1px dashed var(--line);border-radius:3px;padding:14px 16px;color:var(--mute);font-size:.9rem}
.skip{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:4px}
.row-ctl{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sw{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-weight:500}
.sw input{width:18px;height:18px;accent-color:var(--lampfill)}

/* 設備・深層 */
.rows{display:grid;gap:10px}
.rowc{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px}
.rowc .l{min-width:0;flex:1 1 220px;display:grid;gap:2px}
.rowc b{font-weight:700}
.rowc .lv{color:var(--mute);font-size:.82rem;font-variant-numeric:tabular-nums}
.far{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 16px;display:grid;gap:10px}
.far.lit{border-color:var(--lampfill)}
.far.lit .far-n::after{content:"済";font-family:var(--f-disp);font-size:.75rem;margin-left:8px;color:var(--lamp);border:2px solid var(--lamp);border-radius:3px;padding:0 .35rem;vertical-align:middle}
.far-n{font-weight:700;font-size:1.02rem}
.tide{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px;display:grid;gap:10px}
.locked-msg{border:1px dashed var(--line);border-radius:3px;padding:22px;color:var(--mute);display:grid;gap:6px}

/* 日誌 */
.fold{border-bottom:1px solid var(--line);padding-block:4px 14px;margin-top:6px}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:44px;font-family:var(--f-disp);font-size:1.25rem}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 4px 0 2px}
.fold[open]>summary::before{transform:rotate(45deg)}
.fold>summary:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.fold-t{font-weight:400}
.fold>div{margin-top:8px}
@media (prefers-reduced-motion:reduce){.fold>summary::before{transition:none}}
.logs{display:grid;gap:12px}
.log-ch{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 16px;display:grid;gap:6px}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.cx{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.cx-h{display:flex;gap:10px;align-items:center}
.cx-h b{font-family:var(--f-disp);font-weight:400;font-size:1.05rem}
.cx-h small{margin-left:auto;color:var(--mute);font-size:.78rem;white-space:nowrap}
.cx .story{font-size:.9rem;line-height:1.75}
.cx-d{display:grid;gap:3px;font-size:.84rem;color:var(--mute)}
.cx-d span b{color:var(--ink);font-weight:500}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.letter{border:1px solid var(--line);border-radius:3px;padding:10px 12px;display:grid;gap:4px;background:var(--panel);font-size:.9rem}
.letter.no{border-style:dashed;background:transparent;color:var(--mute)}
.letter .story{font-size:.92rem;line-height:1.75}
.stats-dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stats-dl div{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.stats-dl b{display:block;font-family:var(--f-disp);font-weight:400;font-size:1.1rem;font-variant-numeric:tabular-nums}

/* モーダル・トースト */
.modal-wrap{position:fixed;inset:0;z-index:40;background:rgba(6,14,19,.72);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--panel);border:1px solid var(--lampfill);border-radius:3px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:26px 26px 22px;display:grid;gap:14px}
.dlg h2{font-family:var(--f-disp);font-weight:400;font-size:1.5rem;line-height:1.3}
.dlg .unl{font-size:.88rem;color:var(--lamp);font-weight:700}
.dlg .btn{justify-self:end}
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;justify-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:3px;font-size:.9rem;max-width:min(520px,100%);box-shadow:0 4px 18px rgba(0,0,0,.3)}

@media (max-width:560px){
  .hero{grid-template-columns:104px minmax(0,1fr);gap:4px 14px;padding-block:16px 8px}
  .dlg{padding:20px 18px 18px}
  .tag{padding-left:38px}
  .tag::before{left:12px}
}
</style>
</head>
<body>


<div class="app">
  <header class="hero" id="hero">
    <div class="lh" aria-hidden="true">
      <svg viewBox="0 0 200 224" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gBeamR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--lampfill);stop-opacity:.85"/><stop offset="1" style="stop-color:var(--lampfill);stop-opacity:0"/></linearGradient>
          <linearGradient id="gBeamL" x1="1" y1="0" x2="0" y2="0"><stop offset="0" style="stop-color:var(--lampfill);stop-opacity:.85"/><stop offset="1" style="stop-color:var(--lampfill);stop-opacity:0"/></linearGradient>
          <radialGradient id="gGlow"><stop offset="0" style="stop-color:var(--lampfill);stop-opacity:.9"/><stop offset="1" style="stop-color:var(--lampfill);stop-opacity:0"/></radialGradient>
        </defs>

function anomAt(x,y){
  const s=st(), geo=linkGeo(s), spd=C.pipeSpeed(), extra=Math.min(0.3,(performance.now()-lastTick)/1000)*0.35;
  const R=Math.max(16,30/ui.zoom); let best=null, bd=R;
  s.links.forEach(L=>{ const q=geo.get(L.id); if(!q||!L.q.length) return; const T=Math.max(0.2,L.len/spd);
    L.q.forEach(pk=>{ if(!pk.an) return; let p=1-Math.max(0,pk.t-extra)/T; p=Math.min(1,Math.max(0,p));

    if(k==='apr') { const p=C.aprParts(C.UNIT*5); eff=lv>0?'いまの報酬 ×'+fr(C.aprF(C.UNIT*5))+'（種類 '+p.kinds+'/'+p.nk+'・稼働 '+Math.round(p.run*100)+'%・パイプ5m換算）'+(C.resOn()?'　共鳴由来 ×'+fr(C.ampF()):''):'未習得'; }
    if(k==='det') eff='異常の発生間隔 約'+Math.round(300/C.anomF())+'秒に1回';
    const hid=((k==='det'||k==='apr'||k==='res')&&s.chapter<3); const row=u.btn.closest('.rowc'); if(row) row.hidden=hid;
    if(k==='res'){
      const on=lv>=1||s.chapter>=6; setT(u.lv,on?'観測できます':'未開放');
      if(on){ setT(u.btn,lv>=1?'購入済み':'解放済み'); u.btn.disabled=true; } else { const c=C.upCost(k); setT(u.btn,fmt(c)+' 研究費'); u.btn.disabled=s.coins<c; }
      return;
    }
    setT(u.lv,'Lv '+lv+' / '+d.max+'　'+eff);
    if(lv>=d.max){ setT(u.btn,'最大'); u.btn.disabled=true; }
    else { const c=C.upCost(k); setT(u.btn,fmt(c)+' 研究費'); u.btn.disabled=s.coins<c; }
  });
  { const u=UU.allp, inf=C.linksUpInfo(); setT(u.lv,'強化できるパイプ '+inf.n+'本　合計 '+fmt(inf.cost)+' 研究費'); setT(u.btn,'まとめて強化'); u.btn.disabled=!inf.n||s.coins<1; }
  Object.keys(C.AUTO).forEach(k=>{
    const u=UU[k], d=C.AUTO[k];
    if(s.auto[k]){ setT(u.lv,'導入済み'); setT(u.btn,'導入済み'); u.btn.disabled=true; }
    else { setT(u.lv,'未導入'); setT(u.btn,fmt(d.cost)+' 研究費'); u.btn.disabled=s.coins<d.cost; }
  });
}

/* ===== 日誌 ===== */
let lSig='';
function updLog(){
  const s=st(), keys=Object.keys(s.stories), sig=s.chapter+'|'+keys.length+'|'+Object.keys(s.got).length+'|'+Object.keys(s.built).length;
  const tot=C.IDS.length*2;
  if(sig!==lSig){
    lSig=sig;
    const cb=$('logCh'); cb.textContent='';
    if(s.chapter===0) cb.append(h('div',{class:'empty-tag',text:'まだ記録はありません。'}));
    for(let i=s.chapter-1;i>=0;i--){
      const c=C.CH[i];
      cb.append(h('div',{class:'log-ch'},h('p',{class:'k',text:'第'+(i+1)+'章　'+c.who}),h('b',{text:c.t}),h('p',{class:'story',text:c.done})));
    }
    const cx=$('codex'); cx.textContent='';
    const TN=['原料','一次加工','二次加工'];
    C.IDS.forEach(id=>{
      if(!s.got[id]) return;
      const I=C.ITEMS[id], rec=C.REC[id], used=C.IDS.filter(k=>C.REC[k]&&C.REC[k][id]);
      const d=h('div',{class:'cx-d'},h('span',{},'作る場所　',h('b',{text:C.NODE[id].b})));
      if(rec) d.append(h('span',{},'材料　',h('b',{text:Object.keys(rec).map(k=>C.ITEMS[k].n+' ×'+rec[k]).join('、')})));
      if(used.length) d.append(h('span',{},'使い道　',h('b',{text:used.map(k=>C.ITEMS[k].n).join('、')})));
      d.append(h('span',{},'買取窓口での価格　',h('b',{text:fr(I.v*0.5)+' 研究費 / 個'})));
      cx.append(h('article',{class:'cx'},h('div',{class:'cx-h'},stampT(id,false),h('b',{text:I.n}),h('small',{text:TN[I.t]})),h('p',{class:'story',text:C.LORE[id]}),d));
    });
    const fc=$('facCodex'); fc.textContent='';
    const CN={raw:'生産',p1:'一次加工',p2:'二次加工',etc:'その他'};
    const catName=t=>{ const c=C.CATS.find(c=>c.types.includes(t)); return c? CN[c.id] : ''; };
    C.TYPES.forEach(t=>{
      if(!s.built[t]) return;
      const d=h('div',{class:'cx-d'});
      if(C.NODE[t]){
        const rec=C.REC[t];
        d.append(h('span',{},'作るもの　',h('b',{text:C.ITEMS[t].n})));
        if(rec) d.append(h('span',{},'材料　',h('b',{text:Object.keys(rec).map(k=>C.ITEMS[k].n+' ×'+rec[k]).join('、')})));
        d.append(h('span',{},'Lv1の産出　',h('b',{text:fr(C.NODE[t].r)+' 個/秒'})));
        d.append(h('span',{},'建築費の基準　',h('b',{text:fmt(C.NODE[t].c)+' 研究費'})));
      } else {
        const txt={wh:'品物を何種類でも貯める（品目ごとに上限あり）',dock:'選んだテーマの品だけを、必要な数まで受け取る',mkt:'受け取った品を、価値の半分で買い取る'}[t];
        d.append(h('span',{},'はたらき　',h('b',{text:txt})));
      }
      fc.append(h('article',{class:'cx'},h('div',{class:'cx-h'},stampT(t,false),h('b',{text:C.nameOf(t)}),h('small',{text:catName(t)})),h('p',{class:'story',text:C.FLORE[t]}),d));
    });
    const lb=$('letters'); lb.textContent='';
    C.IDS.forEach(id=>{ C.POOL[id].forEach((p,i)=>{
      const got=s.stories[id+i];
      lb.append(got? h('div',{class:'letter'},h('div',{class:'k',text:p.w}),h('p',{class:'story',text:p.t}))
                   : h('div',{class:'letter no'},h('div',{class:'k',text:'？？？'}),h('span',{text:C.ITEMS[id].n+'のテーマで見つかるかもしれません'})));
    }); });
  }
  setT($('letterH'),'拾った手記　'+keys.length+' / '+tot);
  setT($('facH'),'施設図鑑　'+Object.keys(s.built).length+' / '+C.TYPES.length);
  setT($('codexH'),'アイテム図鑑　'+Object.keys(s.got).length+' / '+C.IDS.length);
  const t=Math.floor(s.stats.time), hh=Math.floor(t/3600), mm=Math.floor(t%3600/60);
  const sd=$('statsDl'); const rows=[['経過時間',hh+'時間'+mm+'分'],['完了したテーマ',fmt(s.stats.delivered)],['売却益',fmt(s.stats.sold)],['捕まえた異常試料',fmt(s.stats.caught||0)],['通算の稼ぎ',fmt(s.lifeEarned)],['再構築',s.stats.tides+'回']];
  const html=rows.map(r=>r[0]+r[1]).join('|');
  if(sd._h!==html){ sd._h=html; sd.textContent=''; rows.forEach(r=>sd.append(h('div',{},h('span',{class:'k',text:r[0]}),h('b',{text:r[1]})))); }
}

/* ===== 深層 ===== */
const VU={built:false,far:[],pearl:{}};
function buildVoyage(){
  VU.built=true;
  VU.tideStats=$('tideStats');
  $('tideBtn').addEventListener('click',()=>{
    if(!C.canTide()) return;
    if(!VU.confirm){ VU.confirm=true; setTimeout(()=>{ VU.confirm=false; },5000); render(); return; }
    VU.confirm=false; C.tide(); oSig=''; lSig=''; iSig=''; ui.selB=0; ui.selL=0; ui.from=0; render(); draw();
  });
  const pr=$('pearlRows');
  Object.keys(C.PEARL).forEach(k=>{
    const d=C.PEARL[k], u={};
    u.lv=h('span',{class:'lv'}); u.btn=h('button',{class:'btn pri',type:'button',onclick:()=>{ C.buyPearl(k); render(); }});
    pr.append(h('div',{class:'rowc'},h('div',{class:'l'},h('b',{text:d.n}),h('span',{class:'hint',text:d.d}),u.lv),u.btn)); VU.pearl[k]=u;
  });
  const fr_=$('farRows');
  C.FAR.concat([C.STAR]).forEach((f,i)=>{
    const u={i,f}; u.rc=reqChips(f.req);
    const key= i>=C.FAR.length? 's' : 'f'+i;
    u.btn=h('button',{class:'btn pri',type:'button',onclick:()=>{ C.toggleAct(key); render(); }});
    u.state=h('p',{class:'hint'});
    u.root=h('article',{class:'far'},h('div',{class:'far-n',text:f.n+'　― '+f.a}),u.state,u.rc.el,h('div',{class:'tag-f'},h('span'),u.btn));
    fr_.append(u.root); VU.far.push(u);
  });
}
function updVoyage(){
  const s=st(), on=!!s.ended;
  $('voyLocked').hidden=on; $('voyBody').hidden=!on;
  setCls($('voyTab'),'dim',!on);
  if(!on) return;
  if(!VU.built) buildVoyage();
  const g=C.pearlGain();
  const key=[fmt(s.runEarned),g,s.pearls,C.mult().toFixed(2)].join('|');
  if(VU.tideStats._k!==key){ VU.tideStats._k=key; VU.tideStats.textContent='';
    [['今回の稼ぎ',fmt(s.runEarned)],['得られる知見',String(g)],['持っている知見',String(s.pearls)],['全体の産出倍率','×'+C.mult().toFixed(2)]]
      .forEach(r=>VU.tideStats.append(h('div',{},h('span',{class:'k',text:r[0]}),h('b',{text:r[1]})))); }
  setT($('tideBtn'),VU.confirm?'もう一度押すと再構築 (知見 +'+g+')':'再構築');
  $('tideBtn').disabled=!C.canTide();
  Object.keys(C.PEARL).forEach(k=>{
    const u=VU.pearl[k], d=C.PEARL[k], lv=s.pp[k];
    setT(u.lv,'Lv '+lv+' / '+d.max);
    if(lv>=d.max){ setT(u.btn,'最大'); u.btn.disabled=true; } else { const c=C.pearlCost(k); setT(u.btn,'知見 '+c); u.btn.disabled=s.pearls<c; }
  });
  const nLit=C.litCount();
  VU.far.forEach(u=>{
    const isStar=u.i>=C.FAR.length, lit=isStar? !!s.star : !!s.far[u.i], key=isStar?'s':'f'+u.i;
    setCls(u.root,'lit',lit);
    updChips(u.rc);
    if(lit){ setT(u.state,isStar?'八つ目の色は、場所になった。':'観測した。全施設の産出 ×1.25'); u.btn.disabled=true; setT(u.btn,'観測済み'); return; }
    const locked=isStar&&nLit<C.FAR.length, on=!!s.act[key];
    setT(u.state,locked?'七つの位相をすべて観測すると、挑戦できます。':(on?'目標に選択中。必要な品を実験台が受け取り、そろうと自動で観測します。':'観測すると全施設の産出 ×1.25、知見 +'+(isStar?10:2)+'。「目標にする」を選ぶと、必要な品を実験台が受け取ります。'));
    u.btn.disabled=locked; setT(u.btn,on?'選択中（押すと解除）':'目標にする'); setCls(u.btn,'pri',!on);
  });
}

/* ===== 全体 ===== */
let incWin=[];
function render(){
  const s=st(), now=Date.now();
  setT($('sCoins'),fmt(s.coins));
  incWin.push([now,s.runEarned]); while(incWin.length>1&&now-incWin[0][0]>15000) incWin.shift();
  let inc=0; if(incWin.length>1){ const a=incWin[0], b=incWin[incWin.length-1]; inc=(b[1]-a[1])/Math.max(1,(b[0]-a[0])/1000); }
  setT($('sInc'),'+'+fr(Math.max(0,inc))+'/秒');
  setT($('sBld'),String(s.b.length)); setT($('sPipe'),'パイプ '+s.links.length+'本');
  setT($('sLit'),Math.min(s.chapter,C.CH.length)+' / '+C.CH.length+(C.litCount()?'  +'+C.litCount():''));
  $('sPearlBox').hidden=!(s.pearlsTotal>0||s.ended); setT($('sPearl'),String(s.pearls));
  const lit=Math.min(1,s.chapter/C.CH.length);
  if($('hero')._l!==lit){ $('hero').style.setProperty('--lit',String(lit)); $('hero')._l=lit; }
  const ticks=$('ticks').children; for(let i=0;i<ticks.length;i++) setCls(ticks[i],'on',i<s.chapter);
  setT($('heroSub'), s.ended? '観測は成った。八つ目の色の向こうには、まだ奥がある。' : s.chapter<C.CH.length? 'いまの研究　第'+(s.chapter+1)+'章「'+C.CH[s.chapter].t+'」' : '');
  updTools(); updInsp(); updOrders(); updUp(); updLog(); updVoyage();
}

C.on=function(type,d){
  if(type==='chapter'){
    showModal({kicker:'第'+(d.index+1)+'章　完了',title:d.ch.t,body:[d.ch.done,'助成金 +'+fmt(d.ch.reward)+' 研究費'],extra:d.unlocks.length?'解放: '+d.unlocks.join('、'):''});
  } else if(type==='ending'){
    showModal(Object.assign({},C.ENDING,{btn:'深層へ',extra:'「深層」タブが開きました。深層観測と再構築が遊べます。'}));
  } else if(type==='built'){
    toast('図鑑に載った　'+C.nameOf(d.t));
  } else if(type==='caught'){
    toast('異常試料を捕まえた　+'+fmt(d.c)+' 研究費'+(d.m>1.005?'　鑑定 ×'+fr(d.m):''));
  } else if(type==='anomFirst'){
    toast('パイプを、光る粒が流れている。流れ切る前にタップして捕まえよう');
  } else if(type==='res'){
    toast(C.nameOf(d.t)+'が共鳴している。タップすると、つながる先にも広がる');
  } else if(type==='resTap'){
    toast('共鳴が広がった');
  } else if(type==='got'){
    toast('図鑑に載った　'+C.ITEMS[d.id].n);
  } else if(type==='story'){
    toast('手記を拾った　'+d.w);
  } else if(type==='far'){
    showModal({kicker:'深層観測',title:d.f.n+'を観測した',body:[d.f.t],extra:'全施設の産出 ×1.25 ／ 知見 +2'});
  } else if(type==='star'){
    showModal({kicker:'真の終章',title:C.STAR.n,body:[C.STAR.t].concat(C.STAR.end),btn:'深層をつづける',extra:'知見 +10'});
  } else if(type==='tide'){
    toast('研究室を組み直した　知見 +'+d.g);
  }
};

/* タブ */
const PANES={fac:$('p-fac'),ord:$('p-ord'),up:$('p-up'),log:$('p-log'),voy:$('p-voy')};
function setTab(t){
  curTab=t;
  Object.keys(PANES).forEach(k=>{ setCls(PANES[k],'on',k===t); });
  document.querySelectorAll('.tab').forEach(b=>{ b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false'); });
  if(t==='fac') draw();
}

/* 保存と起動 */
function save(){ try{ localStorage.setItem(KEY,C.serialize()); }catch(e){} }
function start(hot){
  let loaded=false, gap=0;
  try{
    if(hot&&hot.s) loaded=C.load(hot.s);
    else { const raw=localStorage.getItem(KEY); if(raw) loaded=C.load(raw); }
  }catch(e){}
  ui.help=st().chapter===0; $('helpBtn').addEventListener('click',()=>{ ui.help=!ui.help; $('helpBtn').classList.remove('new'); render(); });
  $('facHint').addEventListener('click',()=>{ ui.help=false; render(); });
  buildPalette(); buildUp(); buildDockStock();
  const tk=$('ticks'); for(let i=0;i<C.CH.length;i++) tk.append(h('i'));
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>{ setTool(b.dataset.tool===ui.tool?'sel':b.dataset.tool); render(); }));
  setTab('fac');
  $('delChk').addEventListener('change',e=>{ st().auto.deliverOn=e.target.checked?1:0; });
  $('saveBtn').addEventListener('click',()=>{ save(); toast('保存しました'); });
  let rc=false;
  $('resetBtn').addEventListener('click',()=>{
    if(!rc){ rc=true; setT($('resetBtn'),'本当に消す? もう一度押すと全データが消えます'); setTimeout(()=>{ rc=false; setT($('resetBtn'),'データを消して最初から'); },5000); return; }
    try{ localStorage.removeItem(KEY); }catch(e){}
    C.reset(); location.reload();
  });
  if(loaded){
    const s0=st(); gap=(Date.now()-s0.saved)/1000;
    if(gap>30){ const c0=s0.runEarned; C.advance(gap); const dc=st().runEarned-c0; toast('席を外していた間に '+fmt(dc)+' 研究費を稼ぎました'); }
  }
  if(!st().intro){ showModal(Object.assign({},C.INTRO,{btn:'研究を始める',after:()=>{ st().intro=1; save(); }})); }
  render(); draw();
  let last=Date.now();
  setInterval(()=>{ const n=Date.now(), dt=(n-last)/1000; last=n; if(dt>0) C.advance(dt); lastTick=performance.now(); render(); if(reduce) draw(); },250);
  if(!reduce){ const frame=()=>{ draw(); requestAnimationFrame(frame); }; requestAnimationFrame(frame); }
  setInterval(save,10000);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });
  window.addEventListener('pagehide',save);
  try{ if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({s:C.serialize()})); }catch(e){}
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.ready) hot.ready(start); else start(hot&&hot.data?hot.data:{});
})();
/* ==/UI== */
</script>
